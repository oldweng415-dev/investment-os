# ======================================================

          test -f validation/return_seeking_margin_engine.py || {
            echo "ERROR: validation/return_seeking_margin_engine.py does not exist."
            exit 1
          }

          test -f validation/return_alpha_config.json || {
            echo "ERROR: validation/return_alpha_config.json does not exist."
            exit 1
          }

          test -f validation/return_alpha_state_config.json || {
            echo "ERROR: validation/return_alpha_state_config.json does not exist."
            exit 1
          }

          python -m py_compile \
            validation/return_seeking_margin_engine.py

          python -m json.tool \
            validation/return_alpha_config.json \
            > /dev/null

          python -m json.tool \
            validation/return_alpha_state_config.json \
            > /dev/null


# ======================================================
# B. 每日 Return-Seeking Alpha 決策
# 放在 Run OS Engine 與既有 Update persistent margin state 後面
# ======================================================

      - name: Update return-seeking alpha state
        shell: bash
        run: |
          set -euo pipefail

          python validation/return_seeking_margin_engine.py live \
            --history output/score_history.csv \
            --ticker QQQ \
            --alpha-config validation/return_alpha_config.json \
            --alpha-state-config validation/return_alpha_state_config.json \
            --current-state-config validation/margin_state_config.json \
            --backtest-config validation/margin_backtest_config.json \
            --signals output/latest_signals.json \
            --state output/return_alpha_state.json \
            --execution-output output/return_alpha_execution.json \
            --reference-equity "${REFERENCE_EQUITY_NTD}"

          python -m json.tool \
            output/return_alpha_state.json \
            > /dev/null

          python -m json.tool \
            output/return_alpha_execution.json \
            > /dev/null

          echo "Return alpha execution:"
          cat output/return_alpha_execution.json


# ======================================================
# C. 手動觸發時執行完整探索性回測
# 放在既有 Run exploratory margin validation 後面
# ======================================================

      - name: Run return-alpha validation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          python validation/return_seeking_margin_engine.py self-test

          python validation/return_seeking_margin_engine.py backtest \
            --history output/score_history.csv \
            --ticker QQQ \
            --alpha-config validation/return_alpha_config.json \
            --alpha-state-config validation/return_alpha_state_config.json \
            --current-state-config validation/margin_state_config.json \
            --backtest-config validation/margin_backtest_config.json \
            --output-dir output/return_alpha_validation

          echo "Return-alpha strategy comparison:"
          cat output/return_alpha_validation/strategy_comparison.csv

          echo "Return-alpha validation report:"
          cat \
            output/return_alpha_validation/\
return_alpha_validation_report.json


# ======================================================
# D. 選用：參數鄰近敏感度測試
# 不會自動挑選歷史最佳參數
# ======================================================

      - name: Run return-alpha sensitivity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          python validation/return_seeking_margin_engine.py backtest \
            --history output/score_history.csv \
            --ticker QQQ \
            --alpha-config \
              validation/return_alpha_sensitivity_config.json \
            --alpha-state-config \
              validation/return_alpha_state_config.json \
            --current-state-config \
              validation/margin_state_config.json \
            --backtest-config \
              validation/margin_backtest_config.json \
            --output-dir output/return_alpha_sensitivity

          cat \
            output/return_alpha_sensitivity/\
parameter_sensitivity.csv


